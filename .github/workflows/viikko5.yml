name: Week 5 CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'viikko5/**'
      - '.github/workflows/viikko5.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'viikko5/**'
      - '.github/workflows/viikko5.yml'

jobs:
  test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viikko5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Pytest unit tests
        run: pytest

  deploy:
    name: Deploy to cPouta Server A
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Pull latest changes and run deploy script
        run: ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "cd /home/ubuntu/linux && git pull origin main && bash /home/ubuntu/linux/viikko5/deploy/deploy.sh ${{ github.sha }}"
